site_name: Apuntes DWEC - Desarrollo Web en Entorno Cliente
theme:
  name: material
  palette:
    # Modo Claro
    - scheme: default
      primary: teal        # Mantiene el color verde/teal de tu cabecera
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo Oscuro
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
